<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマートフォンケース紹介</title>

    <style>
    body{
        margin-right: auto;
        margin-left : auto;
        width:700px;

    }

    .btn{
        background-color: #7fbfff;
        border-radius: 20px;
        width: 20em;
        height: 5em;
    }
</style>
</head>

<body>
    <header>
        <h1><span style="background-color:#7fbfff;">ファブリック生地のスマートフォンケース</span></h1>
    </header>
    <main>
        <p>
            <img src="img01.png" alt="メイン画像" width="500"><br>
                今回、ご紹介するのはファブリックな生地のハードケースです。<br>
                色も落ち着いていてビジネスシーンでも使いやすくなっています。<br>
        <br>
            <img src="img02.png" alt="アップ1画像" width="500"><br>
                置いておけばインテリアのように美しく、いつまでも見ていたくなります。<br>
        <br>
            <img src="img03.png" alt="アップ2画像" width="500"><br>
                カメラ部分も精巧に作られているのでサイズがピッタリはまります。<br>
        <br>
            <img src="img04.png" alt="アップ3画像" width="500"><br>
                電源ボタンにもしっかりフィットしているのでストレスなく操作できます。<br>
        <br>
            <img src="img05.png" alt="ひき画像" width="500"><br>
                背面には落下の衝撃を抑えるための特殊加工が施されていて、<br>
                落としても安心です。
        </p>
        <p>
            デザインだけでなく、耐衝撃機能付きで<br>
            価格：<span style="font-size:24px;font-weight:bold;color:#ff0000;">1,980円</span>（税込）
        </p>
        <p>
            ご購入はこちらから<br>
            <button class="btn">ご購入</button>
        </p>
    </main>
</body>
</html>
